services:
  - type: web
    name: dearme-fulltext-collector
    runtime: docker
    dockerfilePath: ./collector_server/Dockerfile
    dockerContext: ./collector_server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: POST_COUNT
        value: "3"
      - key: MIN_BODY_CHARS
        value: "500"
      - key: MIN_FULL_POSTS
        value: "1"
      - key: COLLECTOR_TIMEOUT_MS
        value: "110000"
      - key: NAVIGATION_TIMEOUT_MS
        value: "35000"
      - key: POST_READY_TIMEOUT_MS
        value: "22000"
      - key: COLLECTOR_CONCURRENCY
        value: "1"
      - key: BROWSERLESS_PRIMARY
        value: "true"
      - key: SHARED_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BROWSERLESS_WS
        sync: false
