services:
  - type: web
    name: dearme-fulltext-collector
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: POST_COUNT
        value: "5"
      - key: MIN_BODY_CHARS
        value: "600"
      - key: MIN_FULL_POSTS
        value: "1"
      - key: COLLECTOR_TIMEOUT_MS
        value: "50000"
      - key: SHARED_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BROWSERLESS_WS
        sync: false
